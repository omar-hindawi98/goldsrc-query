name: E2E

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build

            - name: Start HLDS
              run: docker compose up -d

            - name: Run E2E tests
              run: npm run test:e2e
              env:
                  E2E_HOST: 127.0.0.1
                  E2E_PORT: 27015
                  E2E_RCON_PASSWORD: e2e_test_password

            - name: Dump HLDS logs on failure
              if: failure()
              run: docker compose logs hlds

            - name: Stop HLDS
              if: always()
              run: docker compose down
