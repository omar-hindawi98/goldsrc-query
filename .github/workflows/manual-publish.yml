name: Manual Publish

on:
  push:
    branches:
      - temp/manual-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run check:ci
      - run: npm run build
      - run: npm test

      - run: npm publish --access public
