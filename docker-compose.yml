services:
  cstrike:
    platform: linux/amd64
    image: cajuclc/cstrike-docker:latest
    restart: always
    environment:
      - PORT=27015
      - MAP=de_dust2
      - MAXPLAYERS=16
      - SV_LAN=0
      - CPU_MHZ=3000
    ports:
      - 27015:27015/udp
      - 27015:27015
    volumes:
      - /config/server.cfg:/home/steam/cstrike/cstrike/server.cfg
