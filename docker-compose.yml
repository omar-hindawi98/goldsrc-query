services:
  hlds:
    image: jives/hlds:cstrike
    platform: linux/amd64
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
    command: "+map de_dust2 +maxplayers 12 +rcon_password e2e_test_password +sv_password ''"
    healthcheck:
      test: ["CMD-SHELL", "ss -uln | grep -q :27015"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
